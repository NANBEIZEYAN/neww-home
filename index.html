<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO-个人信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
        }

        .hero-section {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .bg-image {
            width: 100%;
            height: 380px; 
            background-image: url('beijintu.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* NO字体修改：纯白、加粗、位置调整 */
        .name-text {
            position: absolute;
            bottom: 15px;
            right: 35%; 
            font-size: 80px;
            font-weight: 900;
            color: #ffffff; /* 纯白色 */
            letter-spacing: 2px;
        }

        .avatar {
            position: absolute;
            bottom: -60px; 
            right: 5%; 
            width: 160px;
            height: 160px;
            border-radius: 50%; 
            border: 3px solid #e0e0e0; 
            background-image: url('xiaomao.jpg');
            background-size: cover;
            background-position: center;
            object-fit: cover;
            z-index: 10;
        }

        .content-section {
            padding: 10px 20px;
        }

        /* 替换为你想要的文案，靠右 */
        .quote {
            text-align: right;
            font-size: 18px;
            color: #000;
            font-weight: bold; /* 加粗一点让它显眼 */
            margin-bottom: 20px;
            margin-right: 150px; 
        }

        .info {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tags span {
            font-size: 18px;
            color: #000;
            border: 1px solid #ccc;
            padding: 5px 15px;
            border-radius: 5px;
            letter-spacing: 1px;
        }

        .signature {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: #eee;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            display: inline-block;
            text-decoration: none;
            color: #000;
            font-size: 16px;
            padding: 10px 40px;
            border: 1.5px solid #000;
            border-radius: 8px;
            transition: 0.3s;
        }

        .next-btn:hover {
            background-color: #000;
            color: #fff;
        }

        @media (max-width: 600px) {
            .bg-image { height: 250px; }
            .name-text { font-size: 50px; right: 25%; bottom: 5px; }
            .avatar { width: 100px; height: 100px; bottom: -40px; right: 5%; }
            .quote { margin-right: 90px; font-size: 16px; }
            .tags span { font-size: 14px; padding: 3px 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            <div class="bg-image">
                <!-- 删除了 (Name)，只保留 NO -->
                <div class="name-text">NO</div>
            </div>
            <div class="avatar"></div>
        </div>

        <div class="content-section">
            <!-- 改成了新的文案 -->
            <p class="quote">我們好久不見</p >
            
            <p class="info">女 ISTP le 23</p >
            
            <div class="tags">
                <span>#三无</span>
                <span>#病恋</span>
                <span>#普陪</span>
                <span>#树洞</span>
            </div>
            
            <p class="signature">我们不是片刻的恋人了</p >
            
            <div class="divider"></div>
            
            <div class="btn-container">
                <a href=" " class="next-btn">下一页</a >
            </div>
        </div>
    </div>

</body>
</html>
