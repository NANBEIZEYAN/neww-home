<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO-个人信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ================= 新增：顶部导航栏 ================= */
        .nav-bar {
            display: flex;
            gap: 10px; /* 方框之间的间距 */
            margin-bottom: 20px;
            flex-wrap: wrap; /* 手机端自动换行 */
        }

        .nav-bar a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 6px; /* 方框圆角 */
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .nav-bar a:hover {
            background-color: #eee;
            border-color: #000;
            color: #000;
        }

        /* 当前所在页面的高亮样式 */
        .nav-bar a.active {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }
        /* =================================================== */

        .hero-section {
            position: relative;
            width: 100%;
            margin-bottom: 40px; 
        }

        .bg-image {
            width: 100%;
            height: 380px; 
            background-image: url('beijintu.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .avatar {
            position: absolute;
            bottom: -60px; 
            right: 5%; 
            width: 160px;
            height: 160px;
            border-radius: 50%; 
            border: 3px solid #e0e0e0; 
            background-image: url('xiaomao.jpg');
            background-size: cover;
            background-position: center;
            object-fit: cover;
            z-index: 10;
        }

        .content-section {
            padding: 10px 20px;
        }

        .text-block {
            text-align: right;
            margin-right: 150px; 
            margin-bottom: 30px;
        }

        .no-title {
            font-size: 50px;
            font-weight: 900;
            color: #000000;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .quote {
            font-size: 18px;
            color: #000;
            font-weight: bold;
        }

        .info {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tags span {
            font-size: 18px;
            color: #000;
            border: 1px solid #ccc;
            padding: 5px 15px;
            border-radius: 5px;
            letter-spacing: 1px;
        }

        .signature {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: #eee;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            display: inline-block;
            text-decoration: none;
            color: #000;
            font-size: 16px;
            padding: 10px 40px;
            border: 1.5px solid #000;
            border-radius: 8px;
            transition: 0.3s;
        }

        .next-btn:hover {
            background-color: #000;
            color: #fff;
        }

        @media (max-width: 600px) {
            .bg-image { height: 250px; }
            .avatar { width: 100px; height: 100px; bottom: -40px; right: 5%; }
            .text-block { margin-right: 90px; }
            .no-title { font-size: 40px; }
            .quote { font-size: 16px; }
            .tags span { font-size: 14px; padding: 3px 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 顶部导航栏 -->
        <div class="nav-bar">
            <a href=" " class="active">首页</a >
            <a href="binglian.html">01 BINGLIAN</a >
            <a href="pupei.html">02 PUPEI</a >
            <a href="shudong.html">03 SHUDONG</a >
        </div>

        <div class="hero-section">
            <div class="bg-image"></div>
            <div class="avatar"></div>
        </div>

        <div class="content-section">
            
            <div class="text-block">
                <div class="no-title">NO</div>
                <p class="quote">我們好久不見</p >
            </div>

            <p class="info">女 ISTP le 23</p >
            
            <div class="tags">
                <span>#三无</span>
                <span>#病恋</span>
                <span>#普陪</span>
                <span>#树洞</span>
            </div>
            
            <p class="signature">我们不是片刻的恋人了</p >
            
            <div class="divider"></div>
            
            <div class="btn-container">
                <a href="binglian.html" class="next-btn">下一页</a >
            </div>
        </div>
    </div>

</body>
</html>
